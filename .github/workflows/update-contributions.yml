name: Update contributions data

on:
  schedule:
    - cron: '0 9 * * 1' # Mondays 09:00 UTC — keeps the instrument inside its 30-day freshness guard
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch contributions from GitHub GraphQL
        run: node scripts/update-contributions.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit and push if changed
        run: |
          if git diff --quiet public/data/contributions.json; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/contributions.json
          git commit -m "Update contributions data"
          git push
